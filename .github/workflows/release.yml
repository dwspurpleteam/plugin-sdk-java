name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - run: make test build lint generate consumer lock

      - run: git diff --exit-code -- gradle.lockfile

  vuln:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        with:
          scan-args: --lockfile=gradle.lockfile

  release:
    needs: [check, vuln]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: build release artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          ./gradlew build publishSdkPublicationToGitHubPackagesRepository -PreleaseVersion="${GITHUB_REF_NAME#v}" --no-daemon

      - name: create github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/libs/*.jar --verify-tag --generate-notes
